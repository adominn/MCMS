:root {

  --proc-fill: #1e2a6e; --proc-ink: #ffffff; --act-fill: #ffffff; --job-fill: #f6f2ff; --store-fill: #f2f2f2; --ext-fill: #fff6ec;

}

  --primary: #a6b4ff; --on-primary: #161616; --lane-b: #212125; --chrome: #262626;
  --proc-fill: #2e3d94; --proc-ink: #ffffff; --act-fill: #262626; --job-fill: #2a2238; --store-fill: #2a2a2a; --ext-fill: #2e2418;
  --k-act: #c6c6c6; --k-data: #7a7a7a; --k-event: #8a9cff; --k-ext: #ff9f43; --k-job: #be95ff; --k-n: #3ddbd9; --path: #ff7eb6;
  --l-pub: #33b1ff; --l-stu: #42be65; --l-lec: #f1c21b; --l-x2: #a8a8a8; --l-dd: #a6b4ff; --l-codl: #ff8389; color-scheme: dark; } }
:root[data-theme="dark"] {

  --proc-fill: #2e3d94; --proc-ink: #ffffff; --act-fill: #262626; --job-fill: #2a2238; --store-fill: #2a2a2a; --ext-fill: #2e2418;

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--chrome); border-bottom: 1px solid var(--hair); }
.bar h1 { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; white-space: nowrap; }
.bar .grow { min-width: 220px !important; }
.k-data path.ln, .k-n path.ln { opacity: .75; }
.bar .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .grow { flex: 1 1 0; min-width: 0; }
.search { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--muted); background: var(--bg); padding: 0 8px; height: 32px; }
.search input { border: 0; background: transparent; outline: none; width: 220px; max-width: 46vw; font-size: 13px; }
.search .cnt { font-size: 11px; color: var(--subtle); font-family: var(--mono); min-width: 3ch; }
.kinds { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--hair); background: var(--canvas); cursor: pointer; font-size: 12px; user-select: none; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip .sw { width: 18px; height: 0; border-top: 2px solid currentColor; }
.btn { height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid var(--hair); background: var(--canvas); cursor: pointer; font-size: 13px; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn[aria-pressed="true"] { background: var(--path); border-color: var(--path); color: #fff; }
.zoom { display: flex; }
.zoom .btn + .btn { border-left: 0; }

/* map */
#map { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; background: var(--canvas); touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#cols { position: absolute; left: 0; right: 0; top: 0; height: 46px; pointer-events: none; z-index: 3; background: var(--chrome); border-bottom: 1px solid var(--hair); overflow: hidden; }
#cols div { position: absolute; top: 0; height: 46px; padding: 6px 10px; box-sizing: border-box; border-left: 1px solid var(--hair); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#cols small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); }
#cols b { font-size: 13px; font-weight: 600; }
#lanes { position: absolute; left: 0; top: 46px; bottom: 0; width: 120px; z-index: 2; pointer-events: none; overflow: hidden; border-right: 1px solid var(--hair); }
#lanes button { position: absolute; left: 0; width: 120px; box-sizing: border-box; padding: 6px 8px 6px 10px; text-align: left; border: 0; border-bottom: 1px solid var(--hair); background: var(--chrome); cursor: pointer; pointer-events: auto; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
#lanes button:hover b { text-decoration: underline; }
#lanes b { font-size: 12px; font-weight: 600; line-height: 15px; display: flex; gap: 6px; align-items: baseline; }
#lanes b i { flex: none; width: 8px; height: 8px; background: var(--lc, var(--subtle)); }
#lanes span { font-size: 10.5px; line-height: 13px; color: var(--muted); }

/* svg content */
.band { fill: var(--canvas); }
.band.alt { fill: var(--lane-b); }
.colsep { stroke: var(--hair); stroke-width: 1; }
.node { cursor: pointer; }
.node text { font-family: var(--sans); }
.node .ref { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.node .tt { font-size: 13px; font-weight: 500; fill: var(--ink); }
.n-act rect.box { fill: var(--act-fill); stroke: var(--lc); stroke-width: 1.5; }
.n-proc rect.box { fill: var(--proc-fill); }
.n-proc .tt { fill: var(--proc-ink); }
.n-proc .ref { fill: var(--proc-ink); opacity: .72; }
.n-job rect.box { fill: var(--job-fill); stroke: var(--k-job); stroke-width: 1.2; stroke-dasharray: 5 3; }
.n-job .tt { font-family: var(--mono); font-size: 11.5px; }
.n-store rect.box { fill: var(--store-fill); }
.n-store line, .n-store .idbox { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.n-store .sid { font-family: var(--mono); font-size: 12px; font-weight: 500; fill: var(--ink); }
.n-ext rect.box { fill: var(--ext-fill); stroke: var(--k-ext); stroke-width: 2; }
.n-ext rect.inner { fill: none; stroke: var(--k-ext); stroke-width: .8; }
.node.sel rect.box { stroke: var(--path); stroke-width: 3; }
.node.match rect.box { stroke: var(--path); stroke-width: 2.5; }
.edge path.ln { fill: none; stroke-width: 1.4; }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge .lb { font-family: var(--sans); font-size: 10.5px; paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
.k-act path.ln { stroke: var(--k-act); } .k-act .lb { fill: var(--k-act); }
.k-data path.ln { stroke: var(--k-data); stroke-dasharray: 6 4; } .k-data .lb { fill: var(--muted); }
.k-event path.ln { stroke: var(--k-event); } .k-event .lb { fill: var(--k-event); }
.k-ext path.ln { stroke: var(--k-ext); stroke-width: 1.8; } .k-ext .lb { fill: var(--k-ext); }
.k-job path.ln { stroke: var(--k-job); stroke-dasharray: 2 3; } .k-job .lb { fill: var(--k-job); }
.k-n path.ln { stroke: var(--k-n); stroke-dasharray: 1 3; } .k-n .lb { fill: var(--k-n); }
.mk-act { fill: var(--k-act); } .mk-data { fill: var(--k-data); } .mk-event { fill: var(--k-event); } .mk-ext { fill: var(--k-ext); } .mk-job { fill: var(--k-job); } .mk-n { fill: var(--k-n); } .mk-path { fill: var(--path); }

.badge circle { fill: var(--path); } .badge text { fill: #fff; font: 600 11px var(--mono); text-anchor: middle; }

svg.focus .node:not(.on) { opacity: .14; }
svg.focus .edge:not(.on) { opacity: .05; }
svg.focus .edge.on path.ln { stroke-width: 2.4; }
svg.journey .edge.step.on path.ln { stroke: var(--path); stroke-width: 3; }
svg.journey .edge.step.on .lb { fill: var(--path); font-weight: 600; }
svg.journey .edge.step.on .badge { display: inline; }

/* drawer */
#panel { position: absolute; right: 0; top: 46px; bottom: 0; width: 360px; max-width: 100%; z-index: 4; background: var(--chrome); border-left: 1px solid var(--hair); overflow-y: auto; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; cursor: auto; }
#panel h2 { font-size: 16px; line-height: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
#panel h3 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); font-weight: 500; margin: 0 0 6px; }
#panel p { margin: 0; font-size: 13px; line-height: 19px; color: var(--muted); }
#panel .refs { font-family: var(--mono); font-size: 11.5px; color: var(--ink); background: var(--bg); padding: 6px 8px; }
#panel ul, #panel ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
#panel li button { display: grid; grid-template-columns: 14px 1fr; gap: 2px 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 4px; cursor: pointer; font-size: 12.5px; line-height: 17px; }
#panel li button:hover { background: var(--bg); }
#panel li button i { grid-row: span 2; width: 14px; height: 0; margin-top: 8px; border-top: 2px solid var(--kc); }
#panel li button small { color: var(--muted); font-size: 11.5px; }
#panel ol li button { grid-template-columns: 26px 1fr; }
#panel ol li button em { grid-row: span 2; font: 600 11px var(--mono); font-style: normal; color: #fff; background: var(--path); height: 20px; display: grid; place-items: center; }
.legend { display: grid; grid-template-columns: 54px 1fr; gap: 8px 10px; align-items: center; font-size: 12.5px; }
.legend svg { width: 54px; height: 24px; overflow: visible; }
.panel-close { align-self: flex-end; }
#panel[hidden] { display: none; }
.panel-open { position: absolute; right: 12px; top: 58px; z-index: 4; }

@media (max-width: 720px) {
  .search input { width: 140px; }
  #panel { top: auto; height: 52%; width: 100%; border-left: 0; border-top: 1px solid var(--hair); }
  #lanes, #lanes button { width: 96px; }
  #lanes button { padding: 4px 6px 4px 8px; }
  #lanes span { display: none; }
}
</style>

const pairs = new Set(EDGES.map(e => e.from + '>' + e.to));
function curve(a, b, off) {
  let s, t, k;

const map = document.getElementById('map');
let s = 1, tx = 0, ty = 0;

function zoomAt(f, cx, cy) { const ns = Math.min(2.5, Math.max(0.06, s * f)); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); }

}

  job: `<rect x="1" y="2" width="52" height="20" fill="var(--job-fill)" stroke="var(--k-job)" stroke-dasharray="5 3"/>`,
  store: `<rect x="1" y="2" width="52" height="20" fill="var(--store-fill)"/><path d="M1 2H53M1 22H53M15 2V22" stroke="var(--muted)" fill="none"/>`,
  ext: `<rect x="1" y="2" width="52" height="20" fill="var(--ext-fill)" stroke="var(--k-ext)" stroke-width="2"/><rect x="4" y="5" width="46" height="14" fill="none" stroke="var(--k-ext)" stroke-width=".8"/>`,
};
const legendLine = k => `<path d="M2 12H50" stroke="var(--k-${k})" stroke-width="2" fill="none" ${({ data: 'stroke-dasharray="6 4"', job: 'stroke-dasharray="2 3"', n: 'stroke-dasharray="1 3"' })[k] || ''}/><path d="M46 8L53 12L46 16z" fill="var(--k-${k})"/>`;
function intro() {
  showPanel(`<div><h3>How to read it</h3><h2>Every function and exchange of MCMS Release 1 on one canvas</h2></div>
    <p>Stages run left to right, from access through the recognition chain to the ongoing work. Each row is a role or a system layer. Drag to pan, scroll or pinch to zoom. Click a box to see what it receives and sends, a role name for everything that role does, or <b>Main journey</b> for the full chain in ${steps.length} numbered hand-offs.</p>
    <div><h3>Boxes</h3><div class="legend">
      <svg>${legendShape.act}</svg><span>Person action (border colour = role)</span>
      <svg>${legendShape.proc}</svg><span>System process, numbered by module (7.2 = MD-07)</span>
      <svg>${legendShape.job}</svg><span>Background job or scheduled task</span>
      <svg>${legendShape.store}</svg><span>Data store (tables or files)</span>
      <svg>${legendShape.ext}</svg><span>External system or body</span>
    </div></div>
    <div><h3>Arrows</h3><div class="legend">${KINDS.map(([k, name]) => `<svg>${legendLine(k)}</svg><span>${name}${k === 'n' ? ' (hidden at first; every change writes the audit log)' : ''}</span>`).join('')}</div></div>
    <div><h3>Roles</h3><ul>${LANES.filter(l => l.c).map(l => `<li><button data-lane="${l.id}" style="--kc:var(${l.c})"><i></i><span>${esc(l.name)}</span><small>${esc(l.who)}</small></button></li>`).join('')}</ul></div>
    <p>Built from the SRS v1.0, SDD v1.0 (modules, events EV-xx, jobs JB-xx) and the UI/UX spec v1.2 screens and flows (FL-xx).</p>`);
}

document.getElementById('stats').textContent = `${NODES.length} functions · ${EDGES.length} exchanges · ${STAGES.length} stages · ${LANES.length} lanes · from SRS v1.0, SDD v1.0, UI/UX spec v1.2`;
intro();
requestAnimationFrame(fit);
</script>
