# Development services (SDD Section 4/10).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mcms
      POSTGRES_PASSWORD: mcms
      POSTGRES_DB: mcms
    ports: ["5433:5432"]
    volumes:
      - mcms-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  mysql:
    image: mysql:8.4
    command: ["--innodb-flush-log-at-trx-commit=2", "--sync-binlog=0"]
    environment:
      MYSQL_ROOT_PASSWORD: mcms
      MYSQL_DATABASE: mcms
      MYSQL_USER: mcms
      MYSQL_PASSWORD: mcms
    ports: ["3306:3306"]
    volumes:
      - mcms-mysql-data:/var/lib/mysql
      - ./docker/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro

volumes:
  mcms-db:
  mcms-mysql-data:
